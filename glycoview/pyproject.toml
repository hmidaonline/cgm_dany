[project]
name = "glycoview"
version = "0.1.0"
description = "Personal glucose data exploration, analysis, and prediction app for AAPS/Nightscout"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    # MongoDB
    "pymongo[srv]>=4.6",
    # Data processing
    "pandas>=2.1",
    "polars>=0.20",
    "pyarrow>=14",
    # ML
    "scikit-learn>=1.3",
    "lightgbm>=4.1",
    # Utilities
    "python-dotenv>=1.0",
    "tabulate>=0.9",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    # Timezone
    "pytz>=2023.3",
    "tzdata>=2023.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "httpx>=0.25",
    "ruff>=0.1",
    "mypy>=1.7",
]
ml-deep = [
    "torch>=2.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
